name: Correct approved v1.11.0 update notes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/correct-v1-11-notes.yml']
permissions:
  contents: read
concurrency:
  group: correct-v1-11-notes
  cancel-in-progress: false
jobs:
  correct-notes:
    if: "github.event.head_commit.message == 'docs: correct approved v1.11.0 update metadata'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify exact published release and prepare notes only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("metadata_expected.json").write_text('{"assets": [{"id": 665594850, "name": "PDF_Bookmarks_v1.11.0_win_x64.exe", "size": 142019667, "digest": "sha256:b0fb5195e5edacf5fc5a49e994e942e70f5d43b21adcf1233ff2b9aac9caaea6"}, {"id": 665594847, "name": "PDF_Bookmarks_v1.11.0_win_x64_cli.exe", "size": 132683743, "digest": "sha256:faa29a4d6d1fbd28e410ca2fccbca623615dfdc4859c1c63d5a30fbb0a329775"}, {"id": 665594853, "name": "PDF_Bookmarks_v1.11.0_win_x64_full.zip", "size": 274166201, "digest": "sha256:250f04cee3d1b9b22d6df46b73374fa46966e7baaa1dc38aceb7b7ce79dcb2f4"}, {"id": 665594854, "name": "PDF_Bookmarks_v1.11.0_win_x64_portable.zip", "size": 142745224, "digest": "sha256:8f1daa36761f8790b7e78ff1380cc6677067b69c4fd3dba0127ebba82f1e405e"}, {"id": 665594851, "name": "PDF_Bookmarks_v1.11.0_win_x64_portable.zip.sha256", "size": 110, "digest": "sha256:84331add01425bfa2197bdbb2afd21711bc32a8130f3f89035324c311df41dda"}, {"id": 665594874, "name": "SHA256SUMS.txt", "size": 510, "digest": "sha256:6d64f92febb48579167edb2c21d7039a5f882aeea6deb2649f9d5c3b5c29c1e7"}, {"id": 665594902, "name": "update-manifest.json", "size": 3261, "digest": "sha256:f299e0267b93d4f5b9b32b9481cabad2ef8983cb1ac8d8bdc4b035d79e1c1e55"}], "body_sha256": "bc9981f49a3750c3a50039d08c193c2a76762f32b0157d2a552dbfd1b3cadfc9"}')
          Path("correct_metadata.py").write_text('"""One-time, notes-only repair of the user-approved v1.11.0 metadata."""\nimport hashlib\nimport json\nfrom pathlib import Path\nimport subprocess\nimport sys\nimport urllib.request\n\nBASE = \'repos/Zerozero05/PDF_Bookmarks\'\nTAG = \'v1.11.0\'\nCOMMIT = \'f335de79a2257ba3fff0303d7e9cc217c5e2b5cf\'\nRID = 420618188\nROOT = Path(\'metadata_repair\')\nNAMES = (\'update-manifest.json\', \'SHA256SUMS.txt\')\n\n\ndef gh(*args):\n    return subprocess.check_output([\'gh\', *args], text=True)\n\n\ndef api(path, method=\'GET\', fields=None):\n    args = [\'api\', f\'{BASE}/{path}\', \'--method\', method]\n    for key, value in (fields or {}).items():\n        args += [\'-f\', f\'{key}={value}\']\n    value = gh(*args)\n    return json.loads(value) if value.strip() else None\n\n\ndef sha(raw):\n    return hashlib.sha256(raw).hexdigest()\n\n\ndef identities(release):\n    return sorted([{k: a[k] for k in (\'id\', \'name\', \'size\', \'digest\')} for a in release[\'assets\']], key=lambda a: a[\'name\'])\n\n\ndef read_asset(asset):\n    with urllib.request.urlopen(asset[\'browser_download_url\'] + \'?notes_asset_id=\' + str(asset[\'id\']), timeout=90) as stream:\n        raw = stream.read(1024 * 1024)\n        assert not stream.read(1), \'Unexpected text asset size\'\n    assert len(raw) == asset[\'size\'] and \'sha256:\' + sha(raw) == asset[\'digest\']\n    return raw\n\n\ndef guard(release):\n    assert release[\'id\'] == RID and release[\'tag_name\'] == release[\'name\'] == TAG\n    assert not release[\'draft\'] and not release[\'prerelease\'] and not release.get(\'immutable\')\n    assert api(\'git/ref/tags/\' + TAG)[\'object\'][\'sha\'] == COMMIT\n    assert api(\'releases/latest\')[\'id\'] == RID\n\n\ndef prepare():\n    release = api(\'releases/\' + str(RID))\n    guard(release)\n    expected = json.loads(Path(\'metadata_expected.json\').read_text())\n    assert identities(release) == expected[\'assets\']\n    assert sha(release[\'body\'].encode()) == expected[\'body_sha256\']\n    ROOT.mkdir()\n    assets = {a[\'name\']: a for a in release[\'assets\']}\n    original = {name: read_asset(assets[name]) for name in NAMES}\n    manifest = json.loads(original[NAMES[0]])\n    assert manifest[\'version\'] == \'1.11.0\' and manifest[\'schema\'] == 1\n    assert \'候选准备\' in manifest[\'release_notes\']\n    manifest[\'release_notes\'] = release[\'body\'].strip()\n    assert all(s not in manifest[\'release_notes\'] for s in (\'候选准备\', \'待确认\', \'未公开\'))\n    patched = {NAMES[0]: (json.dumps(manifest, ensure_ascii=False, indent=2) + \'\\n\').encode()}\n    rows = original[NAMES[1]].decode().splitlines()\n    assert len(rows) == 5 and sum(row.endswith(\'  \' + NAMES[0]) for row in rows) == 1\n    patched[NAMES[1]] = (\'\\n\'.join(sha(patched[NAMES[0]]) + \'  \' + NAMES[0] if row.endswith(\'  \' + NAMES[0]) else row for row in rows) + \'\\n\').encode()\n    for name in NAMES:\n        (ROOT / (\'before_\' + name)).write_bytes(original[name])\n        (ROOT / name).write_bytes(patched[name])\n    (ROOT / \'before_release.json\').write_text(json.dumps(release, ensure_ascii=False, indent=2))\n    print(\'Prepared notes-only correction; binary/ZIP fields and all five other assets remain unchanged.\')\n\n\ndef apply():\n    before = json.loads((ROOT / \'before_release.json\').read_text())\n    release = api(\'releases/\' + str(RID))\n    guard(release)\n    assert identities(release) == identities(before) and release[\'body\'] == before[\'body\']\n    new, renamed = {}, []\n    try:\n        for name in NAMES:\n            temp = ROOT / (name + \'.pending_notes_correction\')\n            temp.write_bytes((ROOT / name).read_bytes())\n            gh(\'release\', \'upload\', TAG, str(temp), \'--repo\', \'Zerozero05/PDF_Bookmarks\')\n            uploaded = api(\'releases/\' + str(RID))\n            item = next(a for a in uploaded[\'assets\'] if a[\'name\'] == temp.name)\n            new[name] = item\n            assert read_asset(item) == (ROOT / name).read_bytes()\n        for name in NAMES:\n            old = next(a for a in before[\'assets\'] if a[\'name\'] == name)\n            api(\'releases/assets/\' + str(old[\'id\']), \'PATCH\', {\'name\': name + \'.previous_notes_correction\'})\n            renamed.append(old)\n            api(\'releases/assets/\' + str(new[name][\'id\']), \'PATCH\', {\'name\': name})\n        final = api(\'releases/\' + str(RID))\n        assert final[\'body\'] == before[\'body\']\n        for item in before[\'assets\']:\n            if item[\'name\'] not in NAMES:\n                assert next(a for a in identities(final) if a[\'name\'] == item[\'name\']) == {k: item[k] for k in (\'id\', \'name\', \'size\', \'digest\')}\n        for name in NAMES:\n            assert read_asset(next(a for a in final[\'assets\'] if a[\'name\'] == name)) == (ROOT / name).read_bytes()\n    except Exception:\n        for name, item in new.items():\n            api(\'releases/assets/\' + str(item[\'id\']), \'DELETE\')\n        for item in renamed:\n            api(\'releases/assets/\' + str(item[\'id\']), \'PATCH\', {\'name\': item[\'name\']})\n        raise\n    for item in renamed:\n        api(\'releases/assets/\' + str(item[\'id\']), \'DELETE\')\n    final = api(\'releases/\' + str(RID))\n    guard(final)\n    assert len(final[\'assets\']) == 7\n    assert {a[\'name\'] for a in final[\'assets\']} == {a[\'name\'] for a in before[\'assets\']}\n    (ROOT / \'after_release.json\').write_text(json.dumps(final, ensure_ascii=False, indent=2))\n    print(\'Corrected only update notes and its checksum; seven original names, code, binaries, ZIPs and tag preserved.\')\n\n\nif __name__ == \'__main__\':\n    {\'prepare\': prepare, \'apply\': apply}[sys.argv[1]]()\n')
          PY
          python3 correct_metadata.py prepare
      - name: Preserve original metadata before correction
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1.11.0-metadata-before-correction
          path: metadata_repair/
          retention-days: 30
          if-no-files-found: error
      - name: Correct notes and checksum with rollback
        run: python3 correct_metadata.py apply
      - name: Preserve correction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1.11.0-metadata-correction-evidence
          path: metadata_repair/
          retention-days: 30
          if-no-files-found: error
